<!doctype html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Galeria | 31 MEU Buffet Infantil</title>
    <meta
      name="description"
      content="Galeria de fotos do 31 MEU Buffet Infantil. Veja nosso espaço, estrutura e decorações."
    />
    <meta name="theme-color" content="#00bcd4" />

    <meta property="og:title" content="Galeria - 31 MEU Buffet Infantil" />
    <meta property="og:description" content="Fotos do nosso espaço completo." />
    <meta property="og:type" content="website" />

    <script>
      document.documentElement.classList.add("js");
    </script>

    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
    ></script>
    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/main.js"></script>
  </head>

  <body>
    <a
      class="skip-link"
      href="#conteudo"
      aria-label="Pular para o conteúdo"
      title="Pular para o conteúdo"
      >↑</a
    >

    <header class="site-header" id="topo">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Voltar para home">
          <img
            class="brand-logo"
            src="assets/img/logo_128.png"
            width="48"
            height="48"
            alt="Logo 31 MEU Buffet Infantil"
          />
          <span class="brand-name">ESPAÇO DE EVENTOS INFANTIS</span>
        </a>

        <div class="header-actions">
          <button
            class="menu-btn"
            type="button"
            aria-expanded="false"
            aria-controls="nav"
            aria-label="Abrir menu"
          >
            <span class="sr-only">Abrir menu</span>
            ☰
          </button>
        </div>

        <nav id="nav" class="nav" aria-label="Navegação principal">
          <ul class="nav-list">
            <li><a href="index.html">Início</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="localizacao.html">Localização</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="contato.html" class="nav-cta">Contato</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="conteudo" tabindex="-1">
      <!-- HERO GALERIA -->
      <section class="section" aria-labelledby="galeriaTitle">
        <div class="container">
          <header class="section-head">
            <h1 id="galeriaTitle">Nossa Galeria</h1>
            <p class="muted">
              Conheça nosso espaço, estrutura e as melhores celebrações.
            </p>
          </header>

          <!-- Swiper carousel -->
          <div
            class="swiper galeria-swiper"
            aria-label="Galeria de fotos com carrossel"
          >
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/1.png"
                  alt="Salão principal"
                  loading="lazy"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/2.png"
                  alt="Área kids com brinquedos"
                  loading="lazy"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/3.png"
                  alt="Mesa decorada com tema infantil"
                  loading="lazy"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/4.png"
                  alt="Buffet com doces e salgados"
                  loading="lazy"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/5.png"
                  alt="Espaço recreativo"
                  loading="lazy"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/6.png"
                  alt="Detalhes da decoração"
                  loading="lazy"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/7.png"
                  alt="Área de servir"
                  loading="lazy"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="assets/img/galeria/8.png"
                  alt="Celebração em andamento"
                  loading="lazy"
                />
              </div>
            </div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
      </section>

      <!-- CTA -->
      <section class="section cta-section">
        <div class="container">
          <h2>Gostou?</h2>
          <p>Entre em contato para agendar sua festa no 31 MEU.</p>
          <div
            style="
              display: flex;
              gap: 12px;
              justify-content: center;
              flex-wrap: wrap;
            "
          >
            <!-- <a href="contato.html" class="btn">Formulário de Contato</a> -->
            <a
              href="#"
              onclick="
                openWhatsApp('Olá! Vi a galeria e quero agendar uma festa.');
                return false;
              "
              class="btn btn-outline"
            >
              Chamar no WhatsApp
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-left">
          <p class="small muted">
            © <span id="year"></span> 31 MEU Buffet Infantil.
          </p>
          <a class="small" href="#topo">Voltar ao topo</a>
        </div>

        <div class="footer-socials">
          <a
            href="https://www.instagram.com/31meubuffet/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            class="social-link"
            title="Visite nosso Instagram"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M7.8 2h8.4C19.4 2 22 4.6 22 8.2v8.4c0 3.6-2.6 6.2-6.2 6.2H7.8C4.2 20.4 2 17.8 2 14.2V8.2C2 4.6 4.6 2 8.2 2z M7.8 4c-2.4 0-4.2 1.8-4.2 4.2v8.4c0 2.4 1.8 4.2 4.2 4.2h8.4c2.4 0 4.2-1.8 4.2-4.2V8.2c0-2.4-1.8-4.2-4.2-4.2H7.8z M12 6.5c3 0 5.5 2.5 5.5 5.5s-2.5 5.5-5.5 5.5-5.5-2.5-5.5-5.5 2.5-5.5 5.5-5.5z M12 8.5c-1.9 0-3.5 1.6-3.5 3.5s1.6 3.5 3.5 3.5 3.5-1.6 3.5-3.5-1.6-3.5-3.5-3.5z M17.5 5.5c.8 0 1.5.7 1.5 1.5s-.7 1.5-1.5 1.5-1.5-.7-1.5-1.5 .7-1.5 1.5-1.5z"
              />
            </svg>
          </a>

          <a
            href="https://www.facebook.com/Buffet31meu/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
            class="social-link"
            title="Visite nosso Facebook"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
          </a>
        </div>
      </div>
    </footer>

    <!-- swiper carousel initialized in assets/js/main.js -->
  </body>
</html>
